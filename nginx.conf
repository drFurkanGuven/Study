# Study projesi — sadece bu projeye ait nginx bloğu
# Sunucuda: /var/www/furkanguven.space/study/nginx.conf
# Aktif etme: ln -s /var/www/furkanguven.space/study/nginx.conf /etc/nginx/conf.d/study.conf
#
# Seçim nedenleri (çakışma kontrolü 13.09.2026):
# - 80/443 nginx tarafından dinleniyor, yeni server bloğu gerekli
# - 8001 docker-proxy dolu -> 5011 seçildi (5000-5010 aralığı boş)
# - study.furkanguven.space diğer server_name'lerle çakışmıyor
#   (mevcut: furkanguven.space, farmacograph.*, qr.*)

upstream study_app {
    server 127.0.0.1:5011;
}

server {
    listen 80;
    server_name study.furkanguven.space;

    # loglar proje klasöründe
    access_log /var/www/furkanguven.space/study/logs/nginx.access.log;
    error_log  /var/www/furkanguven.space/study/logs/nginx.error.log;

    # statik dosyalar (flask static)
    location /static/ {
        alias /var/www/furkanguven.space/study/app/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://study_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }
}
