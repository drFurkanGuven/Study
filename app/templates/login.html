<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giriş — Odak</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="card auth-card">
    <div class="logo">◉ Odak</div>
    <p class="muted">Odaklan. Puan topla. Seriyi koru.</p>
    {% if err %}<div class="alert">{{ err }}</div>{% endif %}
    <form method="post">
      <input name="username" placeholder="Kullanıcı adı" required autocomplete="username">
      <input name="password" type="password" placeholder="Şifre" required autocomplete="current-password">
      <button class="btn primary block" type="submit">Giriş Yap</button>
    </form>
    <p class="muted">Hesabın yok mu? <a href="/register">Kayıt ol</a></p>
  </div>
</div>
</body>
</html>
