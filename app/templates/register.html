<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kayıt — Odak</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="card auth-card">
    <div class="logo"><i class="logodot big"></i>Odak</div>
    <p class="muted">30 saniyede hesabını aç, masaya dön.</p>
    {% if err %}<div class="alert">{{ err }}</div>{% endif %}
    <form method="post">
      <input name="username" placeholder="Kullanıcı adı" required autocomplete="username">
      <input name="password" type="password" placeholder="Şifre (min 3 karakter)" required autocomplete="new-password">
      <button class="btn primary block" type="submit">Kayıt Ol</button>
    </form>
    <p class="muted">Zaten hesabın var mı? <a href="/login">Giriş yap</a></p>
  </div>
</div>
</body>
</html>
